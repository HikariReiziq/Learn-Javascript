<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Proyek Bab 03: Manajemen Inventaris Toko</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.5;
      color: #333;
    }
    .panel {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 15px;
    }
    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    button, select {
      padding: 8px 12px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: #0066cc;
      color: #fff;
      border-color: #004c99;
    }
    .output-box {
      background: #fff;
      border: 1px dashed #666;
      border-radius: 4px;
      padding: 12px;
      font-family: monospace;
      white-space: pre-line;
      min-height: 120px;
    }
  </style>
</head>
<body>

  <h1>Sistem Inventaris Toko Elektronik</h1>
  <p>Gunakan array methods (<code>map</code>, <code>filter</code>, <code>forEach</code>) untuk mengelola data katalog.</p>

  <div class="panel">
    <div class="action-group">
      <button id="btn-semua" class="primary">Tampilkan Semua</button>
      <button id="btn-stok">Hanya Stok Tersedia (> 0)</button>
      <button id="btn-diskon">Terapkan Diskon 10%</button>
    </div>

    <div class="action-group">
      <select id="select-kategori">
        <option value="Semua">-- Pilih Kategori --</option>
        <option value="Laptop">Laptop</option>
        <option value="Aksesoris">Aksesoris</option>
        <option value="Monitor">Monitor</option>
      </select>
      <button id="btn-filter-kategori">Filter Kategori</button>
    </div>

    <div class="output-box" id="daftar-produk">Klik salah satu tombol di atas untuk menampilkan data...</div>
  </div>

  <!-- ============================================================ -->
  <!-- KERJAKAN LOGIKA JAVASCRIPT ANDA DI DALAM TAG SCRIPT BERIKUT  -->
  <!-- ============================================================ -->
  <script>
    // Data awal inventaris
    const katalogAwal = [
      { id: 1, nama: "Laptop ASUS VivoBook", kategori: "Laptop", harga: 8500000, stok: 4 },
      { id: 2, nama: "Mouse Logitech M170", kategori: "Aksesoris", harga: 150000, stok: 15 },
      { id: 3, nama: "Keyboard Mechanical RGB", kategori: "Aksesoris", harga: 450000, stok: 0 },
      { id: 4, nama: "Monitor LG 24 Inch", kategori: "Monitor", harga: 1750000, stok: 6 },
      { id: 5, nama: "Flashdisk Sandisk 64GB", kategori: "Aksesoris", harga: 85000, stok: 20 },
      { id: 6, nama: "Laptop Lenovo ThinkPad", kategori: "Laptop", harga: 12000000, stok: 0 }
    ];

    // Buat variabel salinan aktif agar data bisa dimanipulasi
    let katalogAktif = [...katalogAwal];

    // Satu fungsi cetak untuk semua tombol: ubah format di sini, semua tombol ikut berubah
    const tampilkanProduk = (judul, daftar) => {
      let teks = `${judul} (${daftar.length} produk):\n`;
      daftar.forEach(k => {
        teks += `[${k.id}] ${k.nama} | ${k.kategori} | Rp ${k.harga} | Sisa Stok: ${k.stok}\n`;
      });
      document.getElementById("daftar-produk").textContent = teks;
    };




    // 1. Tampilkan semua (juga langsung saat halaman dibuka)
    tampilkanProduk("Semua Produk", katalogAktif);

    document.getElementById("btn-semua").addEventListener("click", () => {
      tampilkanProduk("Semua Produk", katalogAktif);
    });

    
    // 2. Hanya stok tersedia
    document.getElementById("btn-stok").addEventListener("click", () => {
      const stokTersedia = katalogAktif.filter(k => k.stok > 0);
      tampilkanProduk("Stok Tersedia", stokTersedia);
    });

    // 3. Filter kategori dari dropdown
    document.getElementById("btn-filter-kategori").addEventListener("click", () => {
      // .value harus dibaca di dalam callback agar mengambil pilihan saat tombol diklik
      const kategoriDipilih = document.getElementById("select-kategori").value;



      if (kategoriDipilih === "Semua") {
        tampilkanProduk("Semua Produk", katalogAktif);
      } else {
        const hasilFilter = katalogAktif.filter(k => k.kategori === kategoriDipilih);
        tampilkanProduk(`Kategori ${kategoriDipilih}`, hasilFilter);
      }
    });

    // 4. Diskon 10% (map menghasilkan array baru, katalog asli tetap utuh)
    document.getElementById("btn-diskon").addEventListener("click", () => {
      const hasilDiskon = katalogAktif.map(k => ({
        id: k.id,
        nama: k.nama,
        kategori: k.kategori,
        harga: k.harga * 0.9,
        stok: k.stok
      }));
      tampilkanProduk("Harga Setelah Diskon 10%", hasilDiskon);
    });



  </script>
</body>
</html>
